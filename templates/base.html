
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="csrf-token"
        content="{{ csrf_token() }}"
    >

    <meta name="theme-color" content="#0F1410">

    <link
        rel="icon"
        type="image/x-icon"
        href="{{ url_for('static', filename='img/logo.ico') }}"
    >

    <title>
        {% block title %}SIGIREC{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/tokens.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/shell.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <main>

        {% block content %}
        {% endblock %}

    </main>


    {% block extra_js %}
    {% endblock %}


</body>

</html>
