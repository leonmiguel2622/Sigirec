services:
  - type: web
    name: sigirec
    runtime: python
    plan: standard
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 1 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: SIGIREC_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: TRUST_PROXY
        value: "1"
      - key: SECRET_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: CORS_ORIGINS
        sync: false
